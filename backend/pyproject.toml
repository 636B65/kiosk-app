[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
# Classic SQLAlchemy 1.x-style models/queries in routers/ and models.py cannot
# be type-checked cleanly until migrated to SQLAlchemy 2.0 Mapped; check the
# pure logic modules here.
files = [
    "config.py",
    "timeutil.py",
    "schemas.py",
    "security.py",
    "seed.py",
]