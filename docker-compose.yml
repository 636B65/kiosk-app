services:
  backend:
    build: ./backend
    image: kiosk/backend
    container_name: kiosk-backend
    ports:
      # Bind to host loopback only. The backend must NOT be reachable from the
      # LAN/WAN: it is proxied to the frontend over Docker's internal network
      # (http://backend:8000) and only exposed on localhost so operators can
      # reach /api/health etc. from the host. Remove the port mapping entirely
      # if you never need host access.
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_PATH=/app/data/kiosk.db
      # Generate a fresh random JWT signing key on each container start unless
      # a stable value is provided. Never use a hardcoded key in production.
      - SECRET_KEY=${SECRET_KEY:-}
      # Optional: set a known password for the initial 'admin' account.
      # If unset a random password is generated and printed in the backend logs.
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # Comma-separated list of allowed browser origins (defaults to localhost).
      - CORS_ORIGINS=${CORS_ORIGINS:-}
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: kiosk/frontend
    container_name: kiosk-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # TLS certificate and key. A self-signed pair is generated on first start
      # and never overwritten again; replace them by dropping your own
      # server.crt / server.key into ./data/tls (e.g. a real CA-signed cert).
      - ./data/tls:/etc/nginx/certs
    depends_on:
      - backend
    restart: unless-stopped
