# The Secret every service reads. Create it before the first sync, e.g.
#
#   kubectl -n kiosk create secret generic kiosk-secrets \
#     --from-literal=SECRET_KEY="$(openssl rand -base64 48)" \
#     --from-literal=INTERNAL_TOKEN="$(openssl rand -base64 48)" \
#     --from-literal=PIN_PEPPER="$(openssl rand -base64 48)" \
#     --from-literal=ADMIN_PASSWORD='choose-a-strong-one' \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -base64 24)"
#
# or manage it with Sealed Secrets / External Secrets. Keys:
#
#   SECRET_KEY        JWT signing key shared by every service (>= 32 chars)
#   INTERNAL_TOKEN    service-to-service token (X-Internal-Token)
#   PIN_PEPPER        customer PIN pepper (>= 32 chars); losing it invalidates every PIN
#   ADMIN_PASSWORD    seed password of the first "admin" user (min 8 chars)
#   POSTGRES_PASSWORD password of the "kiosk" Postgres role
apiVersion: v1
kind: Secret
metadata:
  name: kiosk-secrets
type: Opaque
stringData:
  SECRET_KEY: replace-me
  INTERNAL_TOKEN: replace-me
  PIN_PEPPER: replace-me
  ADMIN_PASSWORD: replace-me
  POSTGRES_PASSWORD: replace-me
