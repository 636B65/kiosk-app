# Production: pinned image tags, two replicas of every stateless service, TLS
# on the Ingress. The kiosk-secrets Secret is NOT generated here - create it
# out of band (kubectl, Sealed Secrets, External Secrets; see secrets.example.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kiosk

resources:
  - ../../base

images:
  - name: ghcr.io/636b65/kiosk-microservices/auth-service
    newTag: 1.0.0
  - name: ghcr.io/636b65/kiosk-microservices/catalog-service
    newTag: 1.0.0
  - name: ghcr.io/636b65/kiosk-microservices/customer-service
    newTag: 1.0.0
  - name: ghcr.io/636b65/kiosk-microservices/order-service
    newTag: 1.0.0
  - name: ghcr.io/636b65/kiosk-microservices/settings-service
    newTag: 1.0.0
  - name: ghcr.io/636b65/kiosk-microservices/audit-service
    newTag: 1.0.0
  - name: ghcr.io/636b65/kiosk-microservices/report-service
    newTag: 1.0.0
  - name: ghcr.io/636b65/kiosk-microservices/system-service
    newTag: 1.0.0
  - name: ghcr.io/636b65/kiosk-microservices/frontend
    newTag: 1.0.0

replicas:
  - name: auth-service
    count: 2
  - name: customer-service
    count: 2
  - name: order-service
    count: 2
  - name: settings-service
    count: 2
  - name: audit-service
    count: 2
  - name: report-service
    count: 2
  - name: frontend
    count: 2

patches:
  - path: ingress-patch.yaml
  - path: postgres-storage-patch.yaml
