apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kiosk
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - kiosk.example.com
      secretName: kiosk-tls
  rules:
    - host: kiosk.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
