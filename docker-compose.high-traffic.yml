services:
  backend:
    ports: !reset []
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://kiosk:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/kiosk}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    container_name: !reset null
    ports: !reset []
    volumes: !reset ["./frontend/nginx-high-traffic-internal.conf:/etc/nginx/conf.d/default.conf:ro"]
    environment:
      CERT_DIR: /tmp/kiosk-certs
    depends_on: !reset []

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kiosk
      POSTGRES_USER: kiosk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiosk -d kiosk"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  loadbalancer:
    image: kiosk/frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/nginx-high-traffic.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/tls:/etc/nginx/certs
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
