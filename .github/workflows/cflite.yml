name: ClusterFuzzLite

# Fuzz tests (Atheris, via ClusterFuzzLite) for the input-handling code:
# usernames, PINs, CSV cells, barcodes, order/product payloads and due dates.
# fuzz the changed code briefly; a weekly batch run fuzzes longer.
on:
  pull_request:
  schedule:
    - cron: "11 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz (${{ github.event_name == 'pull_request' && 'code-change' || 'batch' }})
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - name: Build fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          github-token: ${{ github.token }}
          sanitizer: address

      - name: Run fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ github.token }}
          fuzz-seconds: ${{ github.event_name == 'pull_request' && 120 || 900 }}
          mode: ${{ github.event_name == 'pull_request' && 'code-change' || 'batch' }}
          sanitizer: address
          output-sarif: true
