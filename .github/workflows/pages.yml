name: Deploy frontend demo to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["frontend/**", "CHANGELOG.md"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Add changelog and release info for the footer
        run: |
          cp CHANGELOG.md frontend/CHANGELOG.md
          version="$(sed -n 's/^## \[\([0-9][^]]*\)\].*/\1/p' CHANGELOG.md | head -n1)"
          printf '{"version": "%s", "commit": "%s"}\n' "${version:-dev}" "$GITHUB_SHA" > frontend/version.json

      - name: Upload frontend as Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend
          # v4+ skips dotfiles by default; .nojekyll must ship or Jekyll runs
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5