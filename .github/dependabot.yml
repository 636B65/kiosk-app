# Keep dependencies up to date with Dependabot version updates.
# See: https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference

version: 2
updates:
  # Python backend (requirements.txt + requirements-dev.txt)
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(pip)"
      include: "scope"
    groups:
      backend-prod:
        dependency-type: "production"
      backend-dev:
        dependency-type: "development"

  # End-to-end test harness (frontend + Playwright)
  - package-ecosystem: "npm"
    directory: "/tests/e2e"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(npm)"
      include: "scope"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(actions)"