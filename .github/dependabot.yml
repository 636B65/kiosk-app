# Keep dependencies up to date with Dependabot version updates.
# See: https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference

version: 2
updates:
  # Python backend: pip-compile lock files (requirements*.in -> hash-locked *.txt);
  # Dependabot regenerates them with hashes.
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(pip)"
      include: "scope"
    groups:
      backend-prod:
        dependency-type: "production"
      backend-dev:
        dependency-type: "development"

  # End-to-end test harness (frontend + Playwright)
  - package-ecosystem: "npm"
    directory: "/tests/e2e"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(npm)"
      include: "scope"

  # Base images (pinned by digest) of the two images and the fuzzing build.
  - package-ecosystem: "docker"
    directories: ["/backend", "/frontend", "/.clusterfuzzlite"]
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(docker)"
      include: "scope"

  # GitHub Actions workflows (pinned to commit SHAs; the version is the comment)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(actions)"